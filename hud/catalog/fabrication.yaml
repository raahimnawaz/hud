# Slicers, CAM, and shop-floor tooling.

- id: prusaslicer
  name: PRUSASLICER
  glyph: "▲"
  platforms:
    macos:
      detect: { bundle: /Applications/PrusaSlicer.app }
      launch: { open: /Applications/PrusaSlicer.app }
    linux:
      detect: { which: prusa-slicer }
      launch: { exec: [prusa-slicer] }

